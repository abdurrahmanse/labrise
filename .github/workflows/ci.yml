name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Data checks (duplicates, links between entries, labs)
        run: npm run check:data
      - name: Structure checks (import cycles, unused files, unused types)
        run: |
          npm run check:routes
          npm run check:cycles
          npm run check:unused
          npm run check:types
      - name: Build (also type-checks)
        run: npm run build
